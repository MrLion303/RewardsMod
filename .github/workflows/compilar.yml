name: Compilar RewardsMod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar para Forge 1.20.1
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compilar mod
        run: gradle --no-daemon build
      - name: Guardar archivo del mod
        uses: actions/upload-artifact@v4
        with:
          name: RewardsMod-Forge-1.20.1
          path: build/libs/RewardsMod-*.jar
          if-no-files-found: error
          retention-days: 30
