plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'com.negativestudios'
version = '1.0.0'
base { archivesName = 'RewardsMod' }
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { rewardsmod { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'info'
            mods { rewardsmod { source sourceSets.main } }
        }
    }
}
repositories { maven { url = 'https://maven.minecraftforge.net/' } }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.28' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}
jar {
    manifest {
        attributes([
            'Specification-Title': 'RewardsMod',
            'Specification-Vendor': 'NegativeStudios',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'NegativeStudios'
        ])
    }
}
